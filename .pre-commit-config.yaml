repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]  # GitHub Actions YAML uses some tags pyyaml doesn't load by default
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^ragfallback_colab\.ipynb$
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
