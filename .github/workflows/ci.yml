name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint, format, type-check, unit tests + coverage on every supported Python ──
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          uv venv
          uv pip install -e ".[faiss,chroma,huggingface,hybrid]" \
            pytest pytest-cov pytest-asyncio "mypy>=1.11" "ruff>=0.17"

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy ragfallback

      - name: Unit tests with coverage
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: >
          uv run --no-sync pytest tests/unit
          --cov=ragfallback --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85

  # ── MLOps regression gate ─────────────────────────────────────────────────
  # Uses real SQuAD data + heuristic eval (no LLM API keys needed). Quality
  # metrics use a 5% gate; P95 latency uses 12% in ci_regression_gate.py to
  # tolerate runner variance.
  mlops-regression-gate:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      - name: Install MLOps dependencies
        run: |
          pip install -e ".[chroma,huggingface,real-data,mlops]"
          pip install pytest-asyncio

      - name: Build golden dataset from SQuAD (open data, CC BY-SA 4.0)
        run: python examples/build_golden_dataset.py

      - name: Run MLOps regression gate
        run: python examples/ci_regression_gate.py

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-eval-report
          path: examples/baselines.json
          retention-days: 30
